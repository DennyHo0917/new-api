name: Deploy API Route

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: api-route-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
          SERVER_ADDRESS: https://www.api-route.com
          ZPAY_GATEWAY_URL: https://zpayz.cn
          ZPAY_MERCHANT_ID: ${{ secrets.ZPAY_MERCHANT_ID }}
          ZPAY_MERCHANT_KEY: ${{ secrets.ZPAY_MERCHANT_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_ID: ${{ secrets.STRIPE_PRICE_ID }}
          GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.OAUTH_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.OAUTH_GOOGLE_CLIENT_SECRET }}
          X_CLIENT_ID: ${{ secrets.OAUTH_X_CLIENT_ID }}
          X_CLIENT_SECRET: ${{ secrets.OAUTH_X_CLIENT_SECRET }}
        run: |
          runtime_file="$(mktemp)"
          chmod 600 "$runtime_file"
          trap 'rm -f "$runtime_file"' EXIT
          write_runtime_env() {
            name="$1"
            value="$2"
            encoded="$(printf '%s' "$value" | base64 -w 0)"
            printf '%s_B64=%s\n' "$name" "$encoded" >> "$runtime_file"
          }
          write_runtime_env SERVER_ADDRESS "$SERVER_ADDRESS"
          write_runtime_env ZPAY_GATEWAY_URL "$ZPAY_GATEWAY_URL"
          write_runtime_env ZPAY_MERCHANT_ID "$ZPAY_MERCHANT_ID"
          write_runtime_env ZPAY_MERCHANT_KEY "$ZPAY_MERCHANT_KEY"
          write_runtime_env STRIPE_SECRET_KEY "$STRIPE_SECRET_KEY"
          write_runtime_env STRIPE_WEBHOOK_SECRET "$STRIPE_WEBHOOK_SECRET"
          write_runtime_env STRIPE_PRICE_ID "$STRIPE_PRICE_ID"
          write_runtime_env GITHUB_CLIENT_ID "$GITHUB_CLIENT_ID"
          write_runtime_env GITHUB_CLIENT_SECRET "$GITHUB_CLIENT_SECRET"
          write_runtime_env GOOGLE_CLIENT_ID "$GOOGLE_CLIENT_ID"
          write_runtime_env GOOGLE_CLIENT_SECRET "$GOOGLE_CLIENT_SECRET"
          write_runtime_env X_CLIENT_ID "$X_CLIENT_ID"
          write_runtime_env X_CLIENT_SECRET "$X_CLIENT_SECRET"
          runtime_path="/tmp/api-route-runtime-${GITHUB_RUN_ID:-$$}.env"
          scp -q \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/id_ed25519 \
            -P "$DEPLOY_PORT" \
            "$runtime_file" \
            "$DEPLOY_USER@$DEPLOY_HOST:$runtime_path"
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/id_ed25519 \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "RUNTIME_PATH='$runtime_path' bash -s" <<'REMOTE'
          set -eu
          trap 'rm -f "$RUNTIME_PATH"' EXIT
          while IFS= read -r line; do
            name="${line%%=*}"
            encoded="${line#*=}"
            [ -n "$name" ] || continue
            value="$(printf '%s' "$encoded" | base64 -d)"
            export "${name%_B64}=$value"
          done < "$RUNTIME_PATH"
          /data/api-route/deploy.sh
          docker cp "$RUNTIME_PATH" api-route:/data/.env.runtime
          docker exec api-route chmod 600 /data/.env.runtime
          docker restart api-route
          REMOTE
