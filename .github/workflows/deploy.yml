name: Deploy API Route

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: api-route-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          tags: api-route-backend:latest
          outputs: type=docker,dest=/tmp/api-route-image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compress production image
        run: gzip /tmp/api-route-image.tar

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
          SERVER_ADDRESS: https://www.api-route.com
          ZPAY_GATEWAY_URL: https://zpayz.cn
          ZPAY_MERCHANT_ID: ${{ secrets.ZPAY_MERCHANT_ID }}
          ZPAY_MERCHANT_KEY: ${{ secrets.ZPAY_MERCHANT_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_ID: ${{ secrets.STRIPE_PRICE_ID }}
          GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.OAUTH_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.OAUTH_GOOGLE_CLIENT_SECRET }}
          X_CLIENT_ID: ${{ secrets.OAUTH_X_CLIENT_ID }}
          X_CLIENT_SECRET: ${{ secrets.OAUTH_X_CLIENT_SECRET }}
        run: |
          runtime_file="$(mktemp)"
          chmod 600 "$runtime_file"
          trap 'rm -f "$runtime_file"' EXIT
          write_runtime_env() {
            name="$1"
            value="$2"
            encoded="$(printf '%s' "$value" | base64 -w 0)"
            printf '%s_B64=%s\n' "$name" "$encoded" >> "$runtime_file"
          }
          write_runtime_env SERVER_ADDRESS "$SERVER_ADDRESS"
          write_runtime_env ZPAY_GATEWAY_URL "$ZPAY_GATEWAY_URL"
          write_runtime_env ZPAY_MERCHANT_ID "$ZPAY_MERCHANT_ID"
          write_runtime_env ZPAY_MERCHANT_KEY "$ZPAY_MERCHANT_KEY"
          write_runtime_env STRIPE_SECRET_KEY "$STRIPE_SECRET_KEY"
          write_runtime_env STRIPE_WEBHOOK_SECRET "$STRIPE_WEBHOOK_SECRET"
          write_runtime_env STRIPE_PRICE_ID "$STRIPE_PRICE_ID"
          write_runtime_env GITHUB_CLIENT_ID "$GITHUB_CLIENT_ID"
          write_runtime_env GITHUB_CLIENT_SECRET "$GITHUB_CLIENT_SECRET"
          write_runtime_env GOOGLE_CLIENT_ID "$GOOGLE_CLIENT_ID"
          write_runtime_env GOOGLE_CLIENT_SECRET "$GOOGLE_CLIENT_SECRET"
          write_runtime_env X_CLIENT_ID "$X_CLIENT_ID"
          write_runtime_env X_CLIENT_SECRET "$X_CLIENT_SECRET"
          runtime_path="/tmp/api-route-runtime-${GITHUB_RUN_ID:-$$}.env"
          scp -q \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/id_ed25519 \
            -P "$DEPLOY_PORT" \
            "$runtime_file" \
            "$DEPLOY_USER@$DEPLOY_HOST:$runtime_path"
          image_path="/tmp/api-route-image-${GITHUB_RUN_ID:-$$}.tar.gz"
          scp -q \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/id_ed25519 \
            -P "$DEPLOY_PORT" \
            /tmp/api-route-image.tar.gz \
            "$DEPLOY_USER@$DEPLOY_HOST:$image_path"
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/id_ed25519 \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "RUNTIME_PATH='$runtime_path' IMAGE_PATH='$image_path' bash -s" <<'REMOTE'
          set -eu
          trap 'rm -f "$RUNTIME_PATH" "$IMAGE_PATH"' EXIT
          while IFS= read -r line; do
            name="${line%%=*}"
            encoded="${line#*=}"
            [ -n "$name" ] || continue
            value="$(printf '%s' "$encoded" | base64 -d)"
            export "${name%_B64}=$value"
          done < "$RUNTIME_PATH"
          rollback_image=""
          rollback_backend() {
            [ -n "$rollback_image" ] || return 1
            docker image tag api-route-backend:rollback api-route-backend:latest
            cd /data/api-route
            docker compose up -d --no-deps --force-recreate --no-build new-api
            for i in {1..30}; do
              if curl -fsS http://127.0.0.1:3000/api/status >/dev/null; then
                return 0
              fi
              sleep 2
            done
            return 1
          }
          if docker inspect api-route >/dev/null 2>&1; then
            rollback_image="$(docker inspect -f '{{.Image}}' api-route)"
            docker image tag "$rollback_image" api-route-backend:rollback
          fi
          install -m 600 "$RUNTIME_PATH" /data/api-route/data/.env.runtime
          if ! gzip -dc "$IMAGE_PATH" | docker load; then
            rollback_backend || true
            exit 1
          fi
          cd /data/api-route
          if ! docker compose up -d --no-deps --force-recreate --no-build new-api; then
            rollback_backend || true
            exit 1
          fi
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/status >/dev/null; then
              docker image prune -f
              exit 0
            fi
            sleep 2
          done
          rollback_backend || true
          exit 1
          REMOTE
